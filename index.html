<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1e293b" />
<title>我的网页 · 导航</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/home.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⌂</span>
      <span class="brand-name">我的网页</span>
    </div>
    <div class="topbar-right">
      <button class="help-btn" id="manageBtn" type="button" aria-label="管理">✎</button>
      <button class="help-btn" id="addBtn" type="button" aria-label="添加网页">＋</button>
    </div>
  </header>

  <main class="pages">
    <p class="home-intro">这里汇集你制作的所有网页，点卡片即可打开。点右上角「＋」添加新网页，点「✎」进入管理模式（编辑 / 删除）。</p>
    <div class="app-grid" id="appGrid"><!-- 由脚本生成 --></div>
  </main>

  <!-- 添加/编辑弹层 -->
  <div class="sheet-mask" id="editMask" hidden>
    <div class="sheet">
      <div class="sheet-title" id="editTitle">添加网页</div>
      <div class="sheet-body">
        <div class="field">
          <label for="inName">名称</label>
          <input id="inName" type="text" placeholder="如：方程绘图器" maxlength="30" />
        </div>
        <div class="field">
          <label for="inUrl">地址（网页路径或网址）</label>
          <input id="inUrl" type="text" placeholder="grapher.html 或 https://..." />
        </div>
        <div class="field">
          <label for="inIcon">图标（一个 emoji 或单字，可选）</label>
          <input id="inIcon" type="text" placeholder="∿" maxlength="2" />
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="editCancel">取消</button>
        <button class="btn btn-danger" id="editDel" style="display:none">删除</button>
        <button class="btn btn-primary" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/js/home.js"></script>
</body>
</html>
