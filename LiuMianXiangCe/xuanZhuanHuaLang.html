<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .vertical-text {
            /*display: flex;*/
            /*justify-content: flex-end;*/
            float: right; /* 控件右侧展示 */
            text-align: right;
            color: #f9a7a7;
            font-size: 36px;
            writing-mode: vertical-rl;
        }

        ul, li {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .box {
            width: 600px;
            margin: 100px auto;
            perspective: 800px; /* 设置景深 */
            position: relative;

        }
        @media (max-width: 640px) {
            .box { width: 92vw; margin: 40px auto; }
            .item { width: 92vw; }
            .item > li { width: 30.6vw; height: 46vw; margin-left: -15.3vw; transform: rotateY(calc(var(--i) * 40deg)) translatez(46vw); }
            .item > li > img { width: 100%; height: 100%; }
        }

        .item {
            width: 600px;
            height: 200px;
            animation: move 12s infinite linear; /* 盒子旋转动画 */
            transform-style: preserve-3d; /* 开启3D空间 */

        }

        .item > li {
            width: 200px;
            height: 300px;
            position: absolute;
            background-color: red;
            position: absolute;
            top: 0;
            left: 50%;
            margin-left: -100px;
            transform: rotateY(calc(var(--i) * 40deg)) translatez(300px) /* css函数.计算每个盒子的旋转角度 */
        }

        .item > li > img {
            width: 200px;
            height: 300px;
        }

        @keyframes move { /* 动画规则 */
            from {
                transform: rotatex(-24deg) rotateY(0deg);
            }
            to {
                transform: rotatex(-24deg) rotateY(-360deg);
            }
        }
    </style>
</head>
<body style="background-color: #1f2f29">
<div class="box"><!-- 外面的盒子 -->
    <ul class="item">
        <li style="--i:0"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/11.jpg" alt=""></li>
        <li style="--i:1"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/22.jpg" alt=""></li>
        <li style="--i:2"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/33.jpg" alt=""></li>
        <li style="--i:3"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/44.jpg" alt=""></li>
        <li style="--i:4"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/55.jpg" alt=""></li>
        <li style="--i:5"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/66.jpg" alt=""></li>
        <li style="--i:6"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/77.jpg" alt=""></li>
        <li style="--i:7"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/88.jpg" alt=""></li>
        <li style="--i:8"><img src="https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/hltp/99.jpg" alt=""></li>
    </ul><!-- 旋转的盒子 -->
</div>
<p class="vertical-text">清卷绘染稚童趣，华年好奏明媚曲</p>
</body>
</html>
