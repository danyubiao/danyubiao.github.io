<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .zf {
            padding-top: 100px;
            background: #333;
            height: 2000px;
        }

        .zf ul {
            width: 300px;
            height: 300px;
            /*position: absolute;*/
            top: 100px;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            margin-top: 100px;
            /*3d空间*/
            transform-style: preserve-3d;
            animation: box 6s linear infinite;
        }

        @keyframes box {

            /*3d旋转 x y z deg*/
            from {
                transform: rotate3d(0, 0, 0, 0deg);
            }

            to {
                transform: rotate3d(1, 1, 1, 360deg);
            }
        }

        .zf li {
            width: 300px;
            height: 300px;
            list-style: none;
            border: 1px solid black;
            position: absolute;
            opacity: 0.9;
            box-shadow: 0px 0px 10px white;
        }

        .zf li:nth-child(1) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img1.jpg);
            background-position: center;
            background-size: cover;
            transform: translateZ(150px);
        }

        /*后*/
        .zf li:nth-child(2) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img2.jpg);
            background-position: center;
            background-size: cover;
            transform: translateZ(-150px);
        }

        /*左*/
        .zf li:nth-child(3) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img3.jpg);
            background-position: center;
            background-size: cover;
            transform: rotateY(90deg) translateZ(-150px);
        }

        /*右*/
        .zf li:nth-child(4) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img4.jpg);
            background-position: center;
            background-size: cover;
            transform: rotateY(90deg) translateZ(150px);
        }

        /*上*/
        .zf li:nth-child(5) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img5.jpg);
            background-position: center;
            background-size: cover;
            transform: rotateX(90deg) translateZ(150px);
        }

        /*下*/
        .zf li:nth-child(6) {
            background: url(https://chunyu-1311908080.cos.ap-chengdu.myqcloud.com/LiuMianXiangCe/lmxc/img6.jpg);
            background-position: center;
            background-size: cover;
            transform: rotateX(90deg) translateZ(-150px);
        }

        .zf ul:hover {
            animation-play-state: paused;
        }

        .zf ul:hover li:nth-child(1) {
            transform: translateZ(180px);
        }

        .zf ul:hover li:nth-child(2) {
            transform: translateZ(-180px);
        }

        .zf ul:hover li:nth-child(3) {
            transform: rotateY(90deg) translateZ(-180px);
        }

        .zf ul:hover li:nth-child(4) {
            transform: rotateY(90deg) translateZ(180px);
        }

        .zf ul:hover li:nth-child(5) {
            transform: rotateX(90deg) translateZ(180px);
        }

        .zf ul:hover li:nth-child(6) {
            transform: rotateX(90deg) translateZ(-180px);
        }

        #fc {
            background-color: #cc5965;
            position: fixed;
            top: 80%;
            left: 90%;
            width: 100px;
            height: 100px;
            margin: -25px 0 0 -50px;
            display: none;
            text-align: center;
            font-size: 20px;
            border-radius: 20px;
            line-height: 70px;
        }

        #fc:hover {
            background-color: #0d8ddb;
            border-radius: 50px;
        }


        #charge {
            height: 10px;
            width: 120px;
            position: absolute;
            top: 50px;
            left: 0px;
            background-color: #C9F76F;
            margin: 0px;
            /*animation: charge 1s infinite;*/
            -webkit-animation: charge 1s infinite;
            box-shadow: 0px 0px 5px #d01313 inset;
        }

        @-webkit-keyframes charge {
            0% {
                width: 0px;
            }
            100% {
                width: 100%;
            }
        }

    </style>
</head>
<body onscroll="scroll()">
<div class="zf">
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</div>
<div id="fc" onclick="fc_onclick()">回到顶部
    <div id="charge"></div>
</div>



<script type="text/javascript">

    function scroll() {
        var scrollt = document.documentElement.scrollTop + document.body.scrollTop; //获取滚动后的高度
        if (scrollt > 400) {
            document.getElementById("fc").style.display = "inline"
        } else {
            document.getElementById("fc").style.display = "none"
        }
    }

    function fc_onclick() {
        window.scrollTo(0, 0);
    }

</script>
</body>
</html>
