        document.addEventListener('DOMContentLoaded', function() {
            stt = "针灸学是我国中医学体系中最具特色的学科之一，穴位名字往往都很好听，但又很难记，其实，穴位的命名均有一定含义，如利用天体地貌命名的日月、上星；参照动植物命名的伏兔、鱼际、犊鼻、鹤顶；借助建筑物命名的天井、印堂、巨阙等。\n" +
                "穴位名字主要分为几类：\n" +
                "1取象比拟\n" +
                "① 与天文星象和气候比拟命名：天象和气候自然是古人取穴命名的内容之一。如日月、上星、天宗、四满。古人以风为百病之长，因而直接或间接以风命名的诸风穴更多。\n" +
                "② 与地理地形比拟命名：借用地理山川的地名、地形与孔穴所在的体表相比拟，这更为多见。山洼无水之处为谷；如合谷、阳谷，山洼流水之处为溪；如阳溪，水所止处为池，如曲池；百川皆归之处为海，如血海；浅洼水草之地为泽，如少泽；山洼流水之处为谿，如天谿、阳谿；水之细流处为沟，如支沟；水从地出为泉，如涌泉；深潭为渊，如太渊；大川为渎，有中渎；深凹有水之处为井，如天井；又有土之高者为丘，如商丘、外丘；大丘为墟，如灵墟；可通行之处为道，如水道、神道、灵道；地理上的门户为关，如内关、外关、上关、下关；又有直接用山川的名字命名，如昆仑、太乙。\n" +
                "③与居处和社会形态比拟命名：如王者所居谓之宫，如紫宫、劳宫；国君所在或人民聚居之处为都，如大都、阴都；财富与人口集中之处为府，如风府、中府；高大门观谓之阙，如巨阙、神阙；宽敞明亮的居室谓之堂，如玉堂、神堂；堂前门内谓之庭，有神庭、内庭、中庭；厅堂以外的走道谓之廊，如步廊；通风采光之处谓之窗或牖，如天窗、目窗；人可出入、声可通达之处谓之门，如云门、关门、幽门；门之半者谓之户，如气户、脑户；烟囱谓之突，有天突，水突，扶突；凡此等等均为孔穴命名所假借。\n" +
                "④以人体脏象与官制比拟命名：如心为君主之官，藏神，主血脉，而紫宫、神庭、玉堂、神堂，即指为心君所居之宫室，与君主布政之处。如膀胱为水液藏聚的州都之官，得气化而能出，气海，水泉，水道等穴，皆可与之相应。\n" +
                "⑤与衣着服饰比拟命名：如络却、头维。\n" +
                "2审形推理\n" +
                "①以所在与邻近部位推理命名，以各种俞穴为多，如膀胱俞。\n" +
                "②以人体局部形象推理命名，根据名称就可以联想到大体位置，如头面部的百会、上星；四肢的腕骨、偏历。\n" +
                "③以孔穴的功能推理命名，根据孔穴的功能及作用，给予相应的名称，如承光、承泣、承浆、迎香、地机等。\n" +
                "④以经穴的彼此关系命名（详例见下文）\n" +
                "⑤以取穴时的特定体位推理命名，如支正，支沟。\n" +
                "3其他零星命名法\n" +
                "因重视而推崇命名，如孔最。\n" +
                "周老认为，了解穴位的含义有如下几个作用：①由表知里：脏腑深藏，经穴四布，经依脏分，穴与脏应。②顾名知用：穴名与所主病症有关，是古人孔穴命名的另一基本思想。③见名求位：通过对穴名的了解，对于指示穴位所在，也将有助于记忆。④提高学养。\n\n" +
                "让我们一起来了解穴位的前世今生！"
            document.getElementById("chuxingan1").innerText = stt;

        function jingluoxw() {

            var jlm = document.getElementById("jingluoming").value;
            var xw = {
                '手太阴肺经': {
                    '中府': '中，指中气，即天地之气；又指中焦、胸中与中间。府，指府库。中府，意为天地之气在胸中储积之处。对人身上中下三部之气血，俱有调摄之功。',
                    '云门': '云，指天地合气，又象征肺中的脉络。门，出入通达之处。云门，指此处为天地之气升降之门户，而肺脉之蔓延罗络，又有云气之象也。',
                    '天府': '天，指天气与人体的上部。天府，地理名，星座名，两乳名。又为高深之意。喻为有收藏天气的职责和为高深富庶之处，且与其取穴法有关，穴与男子乳头高下相当。',
                    '侠白': '侠，通挟，通夹。白，指肺及白色。谓其挟于肺之两侧上臂之白肉际也。', '尺泽': '尺，指长度。泽，沼泽，又宫名。言其居于尺部形如沼泽之处也。',
                    '孔最': '孔，指孔穴，孔窍。最，为最要，最甚。意为此乃本经中最重要之穴，乃本经中经气最旺之处。',
                    '列缺': '列，指陈列，裂开。缺，指缺口，空隙。古称闪电为列缺。穴在腕上之裂隙与衣袖之边缘处，针下之气常如闪电也。天气之列缺，可与足阳明经地气之丰隆相呼应。',
                    '经渠': '经，指经脉、经气与经过。渠，是水沟和水所流通之处。指穴为经脉与经气交会流通之渠道。',
                    '太渊': '太，高大与尊贵之意。渊，深水，深潭。又鼓声名渊，弓之弯曲处亦名渊。太渊，口中津液名。言经气深如潭水；泽润周身，效同桴鼓，而居于弯曲如弓之处也，为诸脉之会。经气犹如潭水之深不可测也。',
                    '鱼际': '鱼，指拇掌肌肉的形状。际，边际。谓穴在鱼形肌肉之边际也。以邻近而得名。',
                    '少商': '少，幼小，微小之意。商，五音，属金，属肺。少商，是商的高音。言为金气所止或为金气初生之处也。'
                },
                '手阳明大肠经': {
                    '商阳': '商同上，阳，指阳金。意为此乃阳金脉气所生之处。肺为阴金，大肠为阳金，肺经由列缺分出一支走向食指端，阴金至此已转化为阳金矣。',
                    '二间': '二、三，为指骨之第二、三两节。间，间隙，孔窍。二间、三间，为次指第二、三指骨后方之间隙。',
                    '三间': '二、三，为指骨之第二、三两节。间，间隙，孔窍。二间、三间，为次指第二、三指骨后方之间隙。',
                    '合谷': '合，开合、结合与合拢之意。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。合谷，山名。穴在太阴与阳明结合处。开则如谷，合则如山也。更兼手太阴，由列缺别走阳明，在此自应结合依傍。',
                    '阳溪': '阳，指阳经与手背部。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。泛指阳经阳部之凹陷处也。',
                    '偏历': '偏，指侧旁与倾斜。历，指行走与经过。言经穴皆位于前臂之偏旁，并从此分出旁支、斜络于太阴也。杨上善曰',
                    '温溜': '温，温暖。溜，通流，通留。功能温经发汗，又为袖手取暖留止之处。此穴具有温经发汗、疏风散寒之功。袖手取暖在此亦常留而不去也。',
                    '下廉': '上、下，指高低，前后。廉，指边缘，棱隅，偪仄。穴在前臂边缘有棱隅之偪仄处也。廉者，前臂上段偪仄，隆起之象也。',
                    '上廉': '上、下，指高低，前后。廉，指边缘，棱隅，偪仄。穴在前臂边缘有棱隅之偪仄处也。廉者，前臂上段偪仄，隆起之象也。',
                    '手三里': '手，指上肢。三里，指长度及人身上中下三部之里，以其与肘部距离长度及通乎三焦之里而言。穴约在肘下三寸，与足阳明之三里上下相应，对三焦在里诸病无所不包。其上方有点手五里。',
                    '曲池': '曲，弯曲。池，水之停聚处。曲池，地名。穴在肘臂屈曲时肘横纹端凹陷如池之处也。必须屈肘取穴，凹陷方显。经气至此，有如水之入池。',
                    '肘髎': '肘，肱与前臂之间的关节部分。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。泛指穴为肘部之深孔。',
                    '手五里': '手，指上肢。五里，指长度及人身五脏之里。以其与肘部的距离长度较远，及通乎五脏之里而言。与手三里同义。五里与五脏有关。',
                    '臂臑': '臂，上肢之统称。臑，肩下方之肌肉。指穴在臂之臑部而言。穴当三角肌隆起处之端，故直接以臂臑名之。', '肩颙': '肩，项下的部位。髃，同隅，角也。指穴当肩头三隅角也。',
                    '巨骨': '巨，大也。巨骨，即大骨之意。巨骨，古解剖名，穴在肩部之大骨相邻。穴在锁骨与肩胛之间。既属骨穴同名，亦为泛指肩部之大骨而言。',
                    '天鼎': '天，见天府条。鼎，三足两耳。象人之头颈，并喻为吸入天气的贵重门户。穴当侧颈，自为吸入天气之重要门户。',
                    '扶突': '扶，辅佐，扶持。突，凸出，突起。指穴处为人体头这一最大突出之扶持。头为人体之最大突出者，穴下之胸锁乳突肌也突出明显，更为扶持头部所必须，故名。',
                    '禾髎': '禾（ji）髎。禾，曲头木。髎，近骨的孔隙。指穴在形如曲头木的鼻唇沟之下方而言。', '迎香': '迎，迎接。香，芳香。谓其功能通鼻塞，知香臭。'
                },
                '足阳明胃经': {
                    '承泣': '承，承受。泣，泪水，常为泪水之承受处。穴当眼眶下缘正中，与承浆同义。',
                    '四白': '四，四方，四野之意。白，光明，洁白。谓目病取此则四顾皆光明洁白也。',
                    '巨髎': '巨，大也。髎', '地仓': '地，指土地所产之谷物。仓，仓禀，仓库。意为口腔犹如谷物仓库的组成部分。地仓者，合五谷之味与脏腑之官而言也。',
                    '大迎': '大，指大气，大有。迎，迎接。大迎，古骨名。指其可以迎受先后天之气与居于大迎骨之处也。穴居头面为足阳明之脉，可以迎受先后天盛大丰有之气以养人也。下颔骨古称大迎骨，穴处之动脉也称为大迎脉。面此处之穴也称为大迎穴。',
                    '颊车': '颊，面颊，此处指上颔骨。车车轮，指下颔骨。颊车，即下颔关节可以转动之处。颊和辅是单指上颔骨，车是单指下颔骨。而颊车穴则是以下颔骨可以转动处而命名。',
                    '下关': '下，上之对。关，机关，关节。穴在下颔关节颧弓下方，与上关互相对峙。',
                    '头维': '头，头部。维（四角为维），隅（方也，角也）角，维系，维护。谓穴居头之隅角，是维系头冠之处，并可维护头部及四肢之阳气也。头维为头角，是维系头冠之处。头维可以维护诸阳。头维为足阳明脉气之所发，又为足阳明、少阳、阳维之会。四肢阳气不足诸病，取之自有维护之效矣。',
                    '人迎': '人，指人体与生命。迎，迎接。又为接受之意。谓喉结两旁之动脉，可以迎受天地五脏之气以养人也。人迎、寸口、趺阳三大动脉，在中医脉诊居于重要地位。人迎者，胃脉也。',
                    '水突': '水，指水谷之气。突，指穿凿成的洞穴。意为穴乃阳明水谷之气穿突而出之处也。穴为通达地气的水突，与吞吐天气的天突可以互观。',
                    '气舍': '气，指呼吸之气。舍，可以居住安息之处。意为呼吸出入之气在此可以停留也。穴在喉咙之旁，犹如气之舍室也。',
                    '缺盆': '缺，空缺。盆，阔口盛器。缺盆，古解剖名。指其位于缺盆处也。缺乃空缺与空虚之处，与列缺之意有别。缺盆可理解为有如无盖之盆。锁骨上窝正如盆之无盖，空虚如缺。',
                    '气户': '气，指呼吸之气。户，出入居住与谨护闭塞之处。呼吸之气经此可以出入停留，居住藏护也。穴名与穴用，均与气舍相同。',
                    '库房': '库，仓库。房，房室。指穴在胸旁，有如肺气之仓库。穴在玉堂、紫宫之外旁，正当肺气储积之处也。',
                    '屋翳': '屋，覆盖。翳，掩蔽。指穴当覆蔽胸部之处也。穴当防胸之要地，故名。',
                    '膺窗': '膺，前胸。当胸之衣称为膺服，又是壅塞之意。窗，屋上通风采光的洞口。谓穴能开通胸膺的壅塞与位于膺服之边缘也。锁下乳上曰膺。胸膺壅窒不舒诸病，取之则气可通畅也。',
                    '乳中': '乳，指乳头。中，指中央。穴当乳头之正中，故名。', '乳根': '乳，指乳房。根，指根底。穴当乳房之根底部，故名。',
                    '不容': '不，不能，不可。容，容纳，包容。谓其可治胃不能容诸病也。用于呕吐反胃、腹满痃癖诸病，则不容者又将能容矣。',
                    '承满': '承，承担，承受。满，饱满，充满。承满者，上腹可以承受饱满之处，且可用以消除胀满也。上腹本可承受饱满，但过满又将不能承担，且有承担消除胀满之责也。与不容上下连属，可以互参。',
                    '梁门': '梁，通梁。门，出入通达之处。梁门，战国古地名。借喻为五谷入胃所由之路，且可治伏梁病也。穴在承满之下方，正为粮谷下行之门户。又，伏梁，病名。深藏为伏，梁为梁木（屋梁）。谓心下脐上藏有形如梁木之硬块。此为治心下痞满积聚之伏梁病的常用穴，既为五谷入胃之通路，且可消胀化食也。',
                    '关门': '关，指关藏，关闭。门，出入通达之处。指其为纳谷与收藏水谷之门户。穴居胃底，为胃之关。又可治完谷不化、大肠滑泄诸病。关门之名具双重意义。',
                    '太乙': '太乙，象天地混沌之气；又神名，星名，地名。此处以穴位之所在，及其功能与大肠之形象而言。穴居天枢之上方，天地之气至此尚未分明，胃肠之清浊在此亦未分清，有太乙之象也。自有安神定惊、主癫疾狂走诸疾矣。象大肠之盘曲。太，大也。乙，盘曲之象也。与其能治大肠诸病有关。',
                    '滑肉门': '滑，光滑，滑利，滑动。肉，肌肉。门，通往与指向之意。意为此乃通向腹腔滑肉之处。肠居腹内，最为光滑，滑利和易于滑动，故可以滑肉目之，且穴对肠病为有效也。又可治舌病，舌亦滑肉之类也。',
                    '天枢': '天，天地，此指人之上下半身而言。枢，枢机，枢纽。喻穴居人身上下枢要之处也。天枢，本为北斗第一星，此借喻为天地之枢机。与其外侧之大横，可以互观。',
                    '外陵': '外，指身体的表面。陵，隆起的丘陵。外陵，为腹壁内虚外实的象。外陵者，腹壁丰满隆起，有如地面之丘陵，相对于腹中之空匮而言也。',
                    '大巨': '大，饱满充实之意。巨，同钜，富也。大巨者，象腹壁之丰满光泽，而内容又复钜富也。穴在腹壁最高最大充实而有光辉之处，其所包裹者至为丰富珍贵，有如巨大之仓库。下腹实为巨大之粮仓，大巨之名也可与此有关。',
                    '水道': '水，水液，水津。道，大道，道理，道路，通道。指水德乃长养万物之大道，与穴效能行水利尿而言。水道既为水之大道与道理，亦为水之道路和通路，下焦为水道之所出，穴下为输尿管之所过，功能治三焦热结、小便不利。水道之名，义更浅显。',
                    '归来': '归来，是返回的意思。对卵缩和阴下脱诸病，有促使恢复的作用。穴主少腹奔豚，卵上入腹引茎中痛、七疝、阴挺诸病。归来者，能使不归之气，移位之丸，返回本位之意也。',
                    '气冲': '气，指下腹阻胀之气。冲，指冲动，上冲，能主腹有逆气上冲及妊娠子气上攻诸病。',
                    '髀关': '髀，指股部及下肢。关，机关。指穴处乃下肢运动之机关也。穴对下肢拘挛疼痛诸病均可有效。',
                    '伏兔': '伏，俯伏。兔，兽名。指穴处状如俯伏之兔。股前方肌肉丰厚，形如兔伏。',
                    '阴巿': '阴巿（fu）。阴，指人体的前阴部。巿，遮蔽阴部的短裳。穴约当巿的下缘。上古遮蔽阴部的短裳谓之巿。今皆以阴巿为“阴市（shi）”,传抄讹误，由来已久矣。',
                    '梁丘': '梁，指梁食，参梁门条。丘，丘陵。梁丘，春秋古地名。胃为仓癝之官，此为胃之郄穴，譬如梁谷积聚之丘陵也。',
                    '犊鼻': '犊，小牛。鼻，口鼻。膝盖形如牛鼻，穴在膝眼中。',
                    '足三里': '足，指下肢，相对于手而言。三里，指长度及人身上中下三部之里。以其与外膝眼的距离及通乎三焦之里而言。三里，主要是指三寸。又与手阳明之三里上下相应，对三焦在里诸病无所不包，可以互观。',
                    '上巨虚': '上廉。上，相对于下而言。巨，巨大。虚，空虚。巨虚，马名，指穴在胫骨外缘之巨大空软处，并象腿之善走。取之巨虚者举足。以在胻骨外侧，故名为廉。与手之上下廉可以互参。',
                    '下巨虚': '下廉。上，相对于下而言。巨，巨大。虚，空虚。巨虚，马名，指穴在胫骨外缘之巨大空软处，并象腿之善走。取之巨虚者举足。以在胻骨外侧，故名为廉。与手之上下廉可以互参。',
                    '条口': '条，指条风，即东北风。口，同孔，空也，条口，乃治疗下肢风病之孔穴也。条口者，乃治风之孔穴也。谓小腿前缘狭长如条，形如刀口。穴在其处，因而得名。',
                    '丰隆': '丰隆，丰盛之意，又雷神名，又云师名。象地气升发，万物丰隆及小腿前方之肌肉高大丰满也。丰隆是雷和云的意思。此为足太阴、阳明之络穴，正有地气丰隆、云雷所生之义。丰隆是肌肉丰满的意思。穴在小腿前方肌肉丰满高大处，正丰隆之象也。',
                    '解溪': '解，指分解，缓解。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。泛指阳经阳部之凹陷处也。穴在骨解之中，能治足踝骨节缓解诸病。关节间隙在《内经》中常称为“骨解”或“节解”。穴当踝关节大节解之中，因其所在及功用而得名。',
                    '冲阳': '冲，冲要，冲动。阳，指足背，在上。穴当定背最高处，且位于太冲之上方。太冲莫误作冲阳，动脉还居后上方。',
                    '陷谷': '陷，陷阱，自高而下亦谓之陷。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。指经气自高而下如入于谷，及能治水病也。经气自高处之冲阳而走向第二、三跖趾关节如阱如谷之处，陷谷之名至为恰当。穴对水病有效，亦可参证。',
                    '内庭': '内，内里，内方；又同枘，同纳。枘是卯眼，凿是榫头，卯眼与榫头的关系称为凿枘。庭，庭堂，亦处所之意。指穴在跖趾关节形如凿枘之隐蔽处。跖趾关节凹陷如枘，趾骨如凿，穴在形如凿枘于枘之处也。',
                    '厉兑': '厉，疾速状；古称衣带之下垂者亦名厉；又风名；又为安息之意。兑，即孔穴。指穴当奔走跳跃不可缺少之处，且与衣带垂着处相当，有治风及安神之功。厉为踊起与疾飞之意。足部若缺少次趾，则疾走驰骋均将有碍矣。厉为衣带垂着之处。古之衣带垂及足尖，穴当其处，故亦为解。厉为神志安宁之意。厉兑为安神治魇之名穴，亦能治中恶尸厥，于义亦通。'
                },
                '足太阴脾经': {
                    '隐白': '隐，指隐藏与微小。白，指金气的颜色。为土能生金，金气隐伏之意。隐，藏也。白为金色，为土所生。此为足太阴脾土之井穴，言土气在此已经发生，而金气亦已开始隐伏。与太白、商丘、地机等穴可以参照联系。',
                    '大都': '大，盛大，丰富。都，都会，储积，又是池的意思。指穴为土气丰富与储积之处，如水之入于池也。大都也为大池之意，谓经气在此停聚也。',
                    '太白': '太，同大，广大、高大之意。白，指金气的颜色。太白，为天象及地理名。指土能生金，金气至此已经明显及穴位之形象而言。太白，金星名，又神名。此为脾经之腧穴，属土。土生金，用示金气至此已明显如星矣。可与隐白互参。太白，山名，即终南山。穴在高大突起的第一跖骨小头之后缘，且此处皮色亦较白，骨高肉白，故象形比拟而以太白山名之。',
                    '公孙': '公，是年老的尊称和正直的意思。孙，是幼小的卑称和支派的意思。公孙即祖孙。又，公孙为复姓。指其为足太阴与阳明之络穴而言。祖与父皆可称公，公亦正直之意；旁系皆可称孙，孙亦曲细之意（为孙络、孙脉）。足太阴之正经如公，别走阳明之别络如孙，正经与络脉在此分行，正为公孙之义也。',
                    '商丘': '商，商，五音，属金，属肺。丘，丘陵。商丘，地名，又为复姓。为土能生金、金气已聚之意。商于五行属金。商丘的五腧属性亦属金。言经气至此已积聚如丘陵也。可与隐白、太白等穴互参。',
                    '三阴交': '三阴，指足之三阴经而言。交，指交会与交接。为足太阴、少阴、厥阴三条阴经之交会处。',
                    '漏谷': '漏，是渗泄和穴洞的意思。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。水湿与水谷漏出不止诸病，用之为有效也。小便淋沥不止，可取之漏谷；大便滑泄不禁，又象如漏谷。功能渗湿止淋、固肠止利，因其功用而得名。',
                    '地机': '地，指脾土、下部与下肢。机，指机关，机要，又疾病亦喻为机。穴为地气之枢机，又为治疗腹部与下肢病枢要之处。地机，别名脾舍，自为脾土之枢机。对腹部与下肢病可以取用。',
                    '阴陵泉': '阴陵，是人体内侧高起之处。泉，水从窟穴而出。穴在膝部内侧高大隆起处之下方，经气如泉水之外流。与阳陵泉互相对待。',
                    '血海': '血，指气血。海，百川皆归之处。血海者，方其可以统血摄血也。太阴为多血少气之脏，又与多气多血之阳明为表里，故可以治血症见长。',
                    '箕门': '箕，簸箕，又星座名，风名。门，出入通达之处。以其必须箕踞取穴，及可治下肢之风病也。簸箕是扫除的用具，其形前大后小。张腿而坐称为箕踞，是不端之状。穴在股内侧上方，必须张腿取穴，是因取穴的体位而得名。穴能治疗下肢的风病。',
                    '冲门': '冲，指冲动，上冲，能主腹有逆气上冲及妊娠子气上攻诸病。门，出入通达之处。下腹逆气上冲诸病常从此起，可与气冲互观。',
                    '府舍': '府，指脏腑。舍，可以居住安息之处。意为穴下乃脏腑所居之处，亦属泛指腹腔而言。',
                    '腹结': '腹，指腹腔。结，指结聚，结束，收敛，弯曲。以其可治腹中痛结及滑泄诸病。结，曲也。亦象肠之盘曲。故肠之痛结者可舒，而滑泄者亦可敛也。且位于约当腹部结束衣带之处，亦可作为腹结之一说。',
                    '大横': '大，长大，又指人。横，纵横，又指脐。言其横居长大人身之中，脐旁之大横纹中也。',
                    '腹哀': '腹，腹腔，也是重复和富有之意。哀，哀痛，也是爱护之意。指腹裹肠胃，为土气之所在，须加爱护以免腹中哀痛，而腹中哀痛用之亦有效也。',
                    '食窦': '食窦（饲渎或饮yin渎）。食，指食物与饲养。窦，指洞穴与水道。意为穴乃婴儿食物之所出与乳汁之水道也。',
                    '天溪': '天，指天气与人身之上部。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。天气通于肺，泛指为肺气流通之处。',
                    '胸乡': '胸，指胸部。乡，指两肋之间或广大的胸廓。以穴居肋间与胸廓而言。两阶之间谓之乡。乡又是指面积广阔的地区。穴居两肋之间，正有两阶之象。亦可泛指广阔的胸廓为胸乡。',
                    '周荣': '周，周身，周遍。荣，荣茂，荣养。周荣者，言先后天之气可以荣敷周身也。无处不至谓之周，旺盛华茂谓之荣。密雨之云谓之周云。水谷之气谓之荣气。经穴属脾，穴下为肺，先后天之气交会于此。可与其上方之云门、下方之大包互观。',
                    '大包': '大，广大。包，包容，包罗。指广大之人体，为先后天之气所包罗。'
                },
                '手少阴心经': {
                    '极泉': '极，至高之意。泉，水从窟穴而出，又水源也。象经气有如泉水自高而下也。手少阴之经气自此从高下流，正有极泉之象。',
                    '青灵': '青，指神仙，又通清。灵，指神灵，心灵，性灵。青灵者，象心神之清净神妙也。心藏神为阳，又主血为阴。青灵者，阳神阴灵清净神妙之气所聚合也。',
                    '少海': '少，指手少阴心经。海，百川皆归之处。少海，古地名。喻为手少阴心经所入为合之海也。',
                    '灵道': '灵，指神灵，心灵，性灵。道，大道，道理，道路，通道。指手少阴之心灵，乃人身阴阳交会之大道。道为万物之所由，灵为一身之主宰，神灵有道，则形有所禀，气有所归矣。可与青灵互参。',
                    '通里': '通，通达，通畅。里，邻里。以其能通达手少阴太阳之里也。穴能通达少阴之里，又与太阳相邻接，而为少阴太阳之络穴，能深入腹里而下达小肠也。',
                    '阴郄': '阴，指手少阴经。郄，孔穴的通称，又指郄穴。为手少阴郄之简称。阴郄为手少阴之郄穴，故别名手少阴郄。',
                    '神门': '神，指心神及人身之阳气。门，出入通达之处。道家称目为神门，意为穴乃心神出入通达之处。心为阳中之太阳，心阳为人生的本原。穴为手少阴心经之腧原，自可为心阳出入通达之处。',
                    '少府': '少，指手少阴心经。府，指府库。少府，古代主收藏的官职名。言穴用可以收摄心神也。',
                    '少冲': '少，既指手少阴心经，又指经气幼小及小指而言。冲，要冲。为手少阴经经气初出之井穴，又居小指末节之冲要处也。少，小也，幼也。冲，通达也。穴居小指尖端冲要之地，又为少阴之经气初生而未盛之处，少冲之名义可知矣。'
                },
                '手太阳小肠经': {
                    '少泽': '少，指小指及幼小。泽，指光泽，滑润。泽门，古代城门名。少泽，为小指末节经气门户之光泽处。广阔低洼有水之处曰泽，凡物之有光润者亦曰泽。甲根多光润润泽，穴在小指甲角之光泽处也。少泽者，亦指小指末节经气门户之意也。',
                    '前谷': '前与后，是互相对待之意。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。小指本节前方第二节之后方凹陷处为前谷；本节后方第五掌骨之前方为后溪。',
                    '后溪': '前与后，是互相对待之意。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。小指本节前方第二节之后方凹陷处为前谷；本节后方第五掌骨之前方为后溪。',
                    '腕骨': '古解剖名，手外侧腕前起骨名腕骨，骨穴同名。古之腕骨，即今之豌豆骨，穴在其前方陷中。',
                    '阳谷': '阳，指手太阳经，手腕之阳与阳气。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。以其属于阳经阳穴，且有兴阳之效也。穴为手太阳经之原穴，居于尺骨小头高起处之凹陷中，对阳萎病有效。',
                    '养老': '养，奉养。老，年老，老迈。以其功能明目舒筋，治老年阳气不足诸病也。', '支正': '支，分支，支持。正，正直，正行。指其为手太阳正经之分支，走向少阴之络穴，且取穴时必须支肘正臂也。',
                    '小海': '小，指手太阳小肠经。海，百川皆归之处。为手太阳经所入为合之海也，与少海可以互参。', '肩贞': '肩，肩部。贞，指正气，精气。穴为肩部正气所居之处，不容外邪干犯也。',
                    '臑俞': '臑，肩下方之肌肉。指穴在臂之臑部而言。俞，同腧，同输，又通枢。指其为臂部臑肉之枢纽与臂臑经气之所注输也。',
                    '天宗': '天，天空，此指人身之上部。宗，宗仰之意。天宗，星名；又统指天象、天神，或如帝王之宗室，乃众所瞻仰之处也。穴当肩胛骨中部，与曲垣、秉风诸穴彼此相望，有天宗之象。',
                    '秉风': '秉，同柄，即权柄。风，风邪。指穴为治疗背风邪之权柄所在。权柄在握，随我操持，则风病无忧矣。',
                    '曲垣': '曲，弯曲。垣，短墙，又是天体划分的范围。指穴在肩胛骨弯曲高起处之内方也。穴在肩胛冈上窝内侧端，如被短墙所围绕。古人把天上的恒星分为三垣二十八宿，也与天宗相呼应。',
                    '肩外俞': '肩，指肩背。中与外，是互相比较之意。俞，俞穴。穴居肩背、距脊柱稍远者称为肩外俞；距脊柱较近者称为肩中俞。以其与脊柱的距离远近而比较命名。',
                    '肩中俞': '肩，指肩背。中与外，是互相比较之意。俞，俞穴。穴居肩背、距脊柱稍远者称为肩外俞；距脊柱较近者称为肩中俞。以其与脊柱的距离远近而比较命名。',
                    '天窗': '天，天空，此指人身之上部。窗，屋上通风采光的洞口。指其功能开通头面孔窍诸病，犹如人身上部之窗户也。喉舌为声音之门户，呼吸之孔道。穴当其间，且能治耳目诸病。穴在侧颈部。',
                    '天容': '天，天空，此指人身之上部。容，容貌，容体，防身之具亦名容。穴当扶持头容正直与防护头颈之处也。穴当侧颈，正为头容之扶持，与扶突可以互观。',
                    '颧髎': '颧，颧骨。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。指其为颧部之深孔也。',
                    '听宫': '听，指耳的功能。宫，王者之所居。穴在耳前，意为此乃管理听力的高贵之处。'
                },
                '足太阳膀胱经': {
                    '睛明': '睛，目睛。明，光明。为治目病之要穴，能使目睛光亮明白也。', '攒竹': '攒，攒聚。竹，竹叶。眉形有如竹叶，穴眉毛与眉头攒聚处也。',
                    '眉冲': '眉，眉头。冲，冲要与向上之意。穴眉头直上，正当前额冲要之处。',
                    '曲差': '曲，弯曲。差（cha），差错，不齐。指穴当经脉曲折不齐之处。足太阳经自睛明直行向上，行至眉冲处即横行向外，曲而不齐也。',
                    '五处': '五，数名，意为第五；五星。处，居处，所在。穴居前额，犹如诸星所居之处也。前头部在道经中称为天庭（两眉之间也称天庭），穴居其间，正有天上诸星（五星）罗列之象，且在本经序次亦为第五，或系因此而得名。',
                    '承光': '承，承受，奉承，承担。光，光明，光亮。承光，台名。目病昏暗者，能使之承受与承奉光明也。承光，汉代台名。借喻为明目去障，此穴可以担承也。',
                    '通天': '通，通达，通畅。天，指天气。通天，冠名。又指为脑部元神之所在及能开通肺气也。穴约当古代冠所系戴处，可与下条络却互观。与脑神之所在有关。功能开通肺窍，通乎天气，用治鼻病有效。',
                    '络却': '络，联络，缠绕。却，退却，脱落。穴当古人系冠之处，联络缠绕不使所戴之冠退却脱落也。',
                    '玉枕': '玉，贵重之意。枕，指枕骨。穴与枕骨为邻。脑后隆起骨，古今皆称枕骨，古亦称为横骨。相士则称为玉枕骨。',
                    '天柱': '天，指头部。柱，支柱，梁柱。天柱，山名，又星名。意为穴处乃头部之支柱。',
                    '大杼': '大，长大。杼，织布之机杼，又水槽亦名杼。以穴在杼形肌肉之起端而言。脊旁肌肉长大，经气自此下行，具有机杼与水槽之状。',
                    '风门': '风，指气，又指风邪。门，出入通达之处。风门者，既为肺气出入与风邪犯人之门户，也为治风治气之所宜取。穴在肺俞之上方，为肺气出入之所必由。用治风邪外感、上气咳逆诸病，将有双重意义。',
                    '肺俞': '肺，指肺本脏，又为火气勃郁之意。俞，同腧，同输，又通枢。内通肺脏，可治病火病气诸病。凡肺气勃郁、火气太过、咳喘、骨蒸诸病，自可取用。',
                    '厥阴俞': '厥阴，指心包络，又为阴气至极与厥逆之意。俞，同腧，同输，又通枢。内通心包络，并可降逆回阳。厥，逆也，冷也，又极与尽也。厥阴，阴之尽也，手厥阴出自胸中，足厥阴下起大敦上至巅顶。阴极阳生，如心阳不振、四肢厥逆及逆气上冲者，皆可选用。',
                    '心俞': '心，指心本脏，又是“任”与“容”的意思。俞，同腧，同输，又通枢。内通心脏，可以益气行血，安神定惊。心不任物，则神不出，气无君，血无帅，形无主，智无舍，而气血失调、惊狂错乱诸症作矣。责之心俞自有助益。',
                    '督俞': '督，督正，督率，居中；指督脉及脊柱。居人身之中，通乎脊柱，可以总督诸阳，为背部诸俞之统帅。督脉贯脊而行，为脏腑诸俞之所依附，故能督正诸俞，贯通腰脊。既为督脉之俞，又为诸阳之督也。',
                    '膈俞': '膈，指胸膈，关格。俞，同腧，同输，又通枢。内通胸膈，可以开通关格。膈俞者，可以开通胸膈之关格及格拒否塞诸病之处也。',
                    '肝俞': '肝，指肝本脏，又木也，干也。俞，同腧，同输，又通枢。内通肝脏，可达木气之郁滞。木喜畅顺，此可顺其气而达之也。',
                    '胆俞': '胆，指胆本腑，为连肝之府。俞，同腧，同输，又通枢。内通胆腑，利胆疏风。故胆与肝连，同司风本。胆汁郁则身黄，泄则口苦；胆气旺则火升，逆则胁满。取之于此，每可收效。',
                    '脾俞': '脾，指脾本脏；又裨也，并也。俞，同腧，同输，又通枢。内通脾脏，可以积精禀气、助胃化食也。用于水谷不化、精气失荣，是其本职。',
                    '胃俞': '胃，指胃本腑；又围也，委也。俞，同腧，同输，又通枢。内通胃腑，调胃化气。胃俞者，为平人常气之所注输，胃府之外候也。',
                    '三焦俞': '三焦，指胸腹腔上中下三停之空松处。俞，同腧，同输，又通枢。内应全身，升阳决渎。三焦俞乃升阳益气、决渎行水、内应全身之俞也。',
                    '肾俞': '肾，指肾本脏，又藏也，泻也。俞，同腧，同输，又通枢。内通肾脏，引水藏精。肾俞者，藏精之关，引水之宅也。',
                    '气海俞': '气，指下焦之原气。海，是富饶藏聚之意。俞，同腧，同输，又通枢。内应脐下之肓原，吞吐下焦之原气。因上焦主吞，下焦主吐，故脐下肓原（参肓俞条）之脖胦，为人身生气之海。气海俞，即脐下肓原之俞也。',
                    '大肠俞': '大肠，指大肠本腑，又畅也。俞，同腧，同输，又通枢。内通大肠，畅胃去滓。大肠司传导，主变化，体之俞，腑之应也。', '关元俞': '参气海俞及关元条。',
                    '小肠俞': '小肠，指小肠本腑。俞，同腧，同输，又通枢。内通小肠，功在化物。小肠司受盛，主化物。受盛失职，化物无能，自可于此处求之。',
                    '膀胱俞': '膀胱，指膀胱本腑。俞，同腧，同输，又通枢。内通膀胱，藏津决水。膀胱津之府，水之门，外俞内府，彼此互通。',
                    '中膂俞': '中，指人身的中部。膂，背脊。俞，同腧，同输，又通枢。穴在骶部，约居人身之中，为腰膂之气所注输。膂，本作吕。中膂，人身中部之脊骨也。',
                    '白环俞': '白，白色，金气。环，圆环。俞，同腧，同输，又通枢。白环，可能是指肛门或臀部。故白环俞者可以意为肛门或臀部之俞也。',
                    '上髎': '以穴位之排列序言。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴在骶孔中，居上者为上髎，居次者为次髎，居中者为中髎，最下者为下髎。左右共有八穴，合称八髎。',
                    '次髎': '以穴位之排列序言。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴在骶孔中，居上者为上髎，居次者为次髎，居中者为中髎，最下者为下髎。左右共有八穴，合称八髎。',
                    '中髎': '以穴位之排列序言。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴在骶孔中，居上者为上髎，居次者为次髎，居中者为中髎，最下者为下髎。左右共有八穴，合称八髎。',
                    '下髎': '以穴位之排列序言。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴在骶孔中，居上者为上髎，居次者为次髎，居中者为中髎，最下者为下髎。左右共有八穴，合称八髎。',
                    '会阳': '会，会合，交会。阳，指阳经，阳气。为下焦阴阳之气交会之处。下焦既为阴气之所聚，亦为阳气之所生。穴与会阴相邻，自有交通结合与互相对待之义。',
                    '承扶': '承，承受，奉承，承担。扶，扶持，扶助，又风名。谓其对扶持人体与治疗下肢风病，俱可承担也。对人身坐立具有扶持之功。承，佐助担当也。扶，木名。扶木，扶桑也。对肢体风病具有拦截之效。在下肢风病及风病之自下而上者，皆可取之。',
                    '殷门': '殷，是富足与中间之意。门，出入通达之处。指穴在大腿肌肉丰满处之正中也。穴处肌肉丰富，且居大腿之中，以其所在之位置而命名。',
                    '浮郄': '浮，指浮竹。郄，孔隙。谓穴位所在有浮竹之象。穴在膝关节内方外侧，下肢骨自膝关节又生一辅助骨曰腓，故取浮竹之象比譬之，穴即以浮名。',
                    '委阳': '委，委曲顺从貌，亦卧倒之意。阳，指外侧。穴在腘窝正中委中穴之外方。',
                    '委中': '委，委曲顺从貌，亦卧倒之意。中，指中间。即俯身卧倒屈曲膝关节而在腘窝之正中取之。此穴必须俯伏舒身放松肢节，方可在委曲膝关节之腘窝正中取之。',
                    '附分': '附，依附，附属。分，分别，分行。指足太阳互相依附之内外两行，在此分行而下也。足太阳在背部左右侧之内外两行，既属互相依属；而第二行各穴又实为第一行之附属，故第二行之第一穴即名附分。',
                    '魄户': '魄，是随伴精气往来的阴神。户，出入居住与谨护闭塞之处。指其为护卫肺中精微之气的门户。穴在肺俞之外方，既为肺俞之附属，亦为肺精之卫护。',
                    '膏肓俞': '膏肓，指心下膈上之脂膜。俞，同腧，同输，又通枢。内与心膈间脂膜相应，邪正之气可由此出入转输。此穴无所不主，又指为助长正气之门。与肓俞、胞肓、肓门，以及膈俞、膈关诸穴，可以互参。',
                    '神堂': '神，是象征君主的阳气。堂，是高大明敞的居室。指其犹如心君用事的明堂。神堂内平心俞，自应如天子布政之堂矣。',
                    '譩譆': '譩譆，哀痛声。按压取穴时，病人常有畏痛之譩譆声，因而得名。',
                    '膈关': '膈，指胸膈，关格。关，关口，关格。指穴如胸膈之关口，且可开通关格也。横居膈俞之外，实为膈俞之附属，而与膈俞之功用亦密切有关矣。',
                    '魂门': '魂，为人身阳气之精。门，出入通达之处，又为守护之意。魂门者，肝阳出入之门与护卫肝阳之处也。肝之体阴而用阳，为将军之官。魂门平齐肝俞，自应为肝阳出入与护卫肝阳之门户。',
                    '阳纲': '阳，指少阳刚直之性。纲，伸张之意。意为胆气宣明，则阳气自然伸张也。胆为将军，胆主决断。肝胆依辅，阳纲之气得以伸张矣。',
                    '意舍': '意，意念，意志。舍，可以居住安息之处。脾气安宁，则心意自然聪慧也。脾藏意。意舍为脾俞之附属，犹如脾气休息留止之处也。',
                    '胃仓': '胃，指胃本腑；又围也，委也。仓，仓禀，仓库。指其犹如胃府之仓库。横居胃俞之外，为胃俞之附属，可与太仓（中胱）互观。',
                    '肓门': '肓，此处指腹部之肓膜。门，出入通达之处，又为守护之意。指其有如诸肓门户之意。本穴上有膏肓，下有胞肓，前肓俞，此则为诸肓之门也。',
                    '志室': '志，志向，意志；此指肾之精气。室，人物所居之处，亦充实之意。志室者，必须肾气充实，意志方能发挥。志室平齐心俞，肾气有归，则神志不乱矣。',
                    '胞肓': '胞，指胞宫及膀胱。肓，此处指腹部之肓膜。指穴与下腹胞肓之气能互相感通也。穴与气海前后相望，同以肓气为原，可与诸肓穴及气海互参。',
                    '秩边': '秩，秩序，整齐。边，边际，边陲。指其位于背部秩序井然诸穴之边际也。',
                    '合阳': '合，会合。阳，指足太阳经。谓足太阳左右侧分行之两行，至此又行会合也。足太阳在背部左右侧，自附分穴分为内外两行，下行相遇于委中后，至此又复合为一支而下贯腨内也。',
                    '承筋': '承，承受，奉承，承担。筋，经筋，筋肉。指其位于足太阴经筋所结之处，且全身躯体筋肉之重，此处可以承担也。',
                    '承山': '承，承受，奉承，承担。山，指躯体之高重。人身高大沉重如山，腨肠之分肉足可承受也。穴在腨肠分肉之间，当挺身直立时，则分肉更为明显。与承筋、承扶其义相近。',
                    '飞扬': '是飞举扬起，斜行别出，脱离正轨之意。为步行不稳、经脉别出及魂梦颠倒之象。指行走不稳。腰腿酸软无力，行步摇晃不定，正有飞扬之象。穴能沟通司人身蹻捷的阴蹻与阳蹻，功可祛风健腰膝助行走，则飞扬之状可除矣。穴能宁神安魂梦、治头目眩晕，则飞扬可止矣。',
                    '跗阳': '跗，足背。阳，指上方，外方。穴在小腿下端外侧、足背之上方，有如足跗之阳也。', '昆仑': '指高山或高丘。穴在高大外踝之后方。',
                    '仆参': '仆，指御者，仆从。参，同三，又同骖；或作参拜解。言穴位如车之左右骖，且在状如参拜时方可便于取穴。穴在左右足跟外侧，如驾御人身上三部之左右骖也。',
                    '申脉': '申，同伸，同呻；又十二时之一。脉，经脉。指其可治经脉之屈伸不能及气郁而呻诸病，且可内应膀胱之本府也。申脉为阳蹻脉所生，太阳主一身之表，故能治屈伸不能、筋脉拘挛诸病。肾与膀胱为表里，在气郁不伸及气郁而呻者，申脉与复溜同取，每可收效。申，申时，正是膀胱之时。申脉穴可以认为是膀胱本府之穴。',
                    '金门': '金，为肺金之气。门，出入通达之处，又为守护之意。金门者，意为熄风利水之门户也。对风木病有效。金可克木，所主多筋抽搐风木之病。',
                    '京骨': '古解剖名，穴当其处。小趾本节后大骨名京骨，即令之第五跖骨，穴在第五跖骨粗隆下，赤白肉际。',
                    '束骨': '束缚，收束。骨，指趾骨。穴位如趾骨之束，又能收束骨节缓纵诸病也。小趾第五本节有“束”之象，故穴名束骨，且能治肢节疼痛缓纵诸病。',
                    '通谷': '通，通畅，疏通。谷与榖通。功能除结积留饮、胸满食不化，为足部通胀消谷之穴，可与腹通谷互参。',
                    '至阴': '至，至极，到达之意。阴，指肾与足少阴经及土气而言。至阴，谓经脉至此已入于足少阴之经脉和通于土气也。足太阳之脉从头走足，至此已阳尽阴生，交入足少阴之经脉矣，故即以至阴名之。'
                },
                '足少阴肾经': {
                    '涌泉': '涌，涌出，上涌。泉，水从窟穴而出。言经气如泉水之上涌，功能通调水道也。穴居足底，经气自下而上，正涌泉之象也。',
                    '然谷': '然，指然骨。然骨，古解剖名。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。穴在然骨下方有如山谷之凹陷处。',
                    '太溪': '太，高大与尊贵之意。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。穴在内踝与跟腱间形如溪谷之处，乃人身孔穴中之尊贵者也。',
                    '大钟': '大，小之对，又同太。钟，同踵。指穴为经气在踵部藏聚之处，而踵部足之大骨，又如酒钟和箍铃也。穴当踝关节下方之足跟部，下大上小，且摇摆善动，亦钟铃之象也。又为足少阴之大络，乃肾气之所钟也。',
                    '水泉': '水，指水液，小便。泉，水从窟穴而出，又钱也。水泉，病名。能治小便淋沥之水泉病，亦象经气在此如泉水之外流。',
                    '照海': '照，指光明照射。海，指广大深远。言肾之真阳渊深如海，能光照周身也。穴在内踝下方之凹陷中，亦可比拟为海。',
                    '复溜': '复，通伏。溜，通流，通留。指其功能通调水道，维护与恢复水液之正常流行。',
                    '交信': '交，交通，交接。信，音信；又通伸，通申。穴在内踝上方，谓其可与申脉及三阴交音信相通，也与屈伸足部之踝关节与有交通联系。',
                    '筑宾': '筑，筑功。宾，同摈，除也。言其能摈除肾间之筑筑动气也。',
                    '阴谷': '阴，指内侧。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷；又风名。穴当膝关节内侧形如山谷之凹陷处，为治疗下肢风病所当取。在膝股阴侧之冷风湿痹，此处正可取用也。',
                    '横骨': '古解剖名。穴当横骨之边际，骨穴同名。即今之耻骨。', '大赫': '大，盛大。赫，显赫。意为穴当下焦元气边显赫盛大之处。',
                    '气穴': '气，指下焦之原气。穴，腧穴，亦窟藏之意。肾主纳气，穴下即为元气收藏之处。气穴本为孔穴的通称，此因关元为下焦元气关藏之处，穴在其旁，故名。',
                    '四满': '四，通驷，指驷星。满，盈满，胀满，又指小满节。言地气充盈上与驷星相应，且能治腹部四面膨胀满肿诸病也。',
                    '中注': '中，指中衣（即内衣），五中。注，灌注，又附着之意。指穴在中衣所附着之处，与水谷之气由此分注于五脏也。着内衣与系中带，使之附着而不脱落，均正当穴处，故名。',
                    '肓俞': '肓，此处指腹部之肓膜。俞，同腧，同输，又通枢。指穴为肠外脂膜之气所注输处。可与胞肓、肓门、气海及气海俞等穴互参。',
                    '商曲': '商，商，五音，属金，属肺；又是从外知内、下降与度量的意思。曲，深隐盘屈之象。指肺商之气下络大肠还循胃口，与食物由此下降进入肠曲，以及胃肠盘曲之象，均可由此度量而得知也。',
                    '石关': '石，通食，又坚硬之意。关，关隘，要地。指穴处为饮食在胃之关隘，亦为治疗石水病之要地也。穴迁胃而经属肾，调之于此，则关门利而石水可消矣。',
                    '阴都': '阴，指水谷之气与阴经。都，都会，储积，又是池的意思。指穴处为地气之所聚亦为阴经之所会也。', '腹通谷': '通谷，参足通谷条。指其既为水谷之所通，又能消胀化食也。',
                    '幽门': '幽，幽深，隐蔽；又指地气。门，出入通达之处。指穴处犹如胃气之门户及足少阴经气深藏与出入之处也。',
                    '步廊': '步，行步，循行与度量之意。廊，堂外的通道。谓胸中行两旁各穴可由此循序度量而得。穴当中庭外方，其上方各穴皆以均等距离顺次排列，犹如堂外之廊也。',
                    '神封': '神，神，指心神及人身之阳气。封，是疆界与富有之意。指穴下为心神之所居与心阳藏之处。心为主神的君主之官，胸中为心阳之居室。穴与心邻，自应为心神之封地和为心阳最为丰富与藏聚之处矣。',
                    '灵墟': '灵，指神灵，心灵，性灵。墟，丘墟。灵，星名。灵墟，地名。指其为心灵所居之处。穴当胸部肌肉高起处之孔隙中，则“虚”与“墟”之义兼备之矣。与青灵可以互参，亦与神封、神藏义近。',
                    '神藏': '神，心神。藏，藏聚。指其为心神藏聚之处。与神封、灵墟可以互参。', '彧中': '彧，同郁，畅顺貌。中，指胸中，又指情志，参中渚条。谓其功能宽胸理气，使胸怀舒畅也。',
                    '俞府': '俞，俞穴，转输。府，首府，府第。指其为诸俞之首府与经气由此入喉也。肺朝百脉，穴居肺之上方。全身以俞命名的各穴皆在其下，犹如诸俞之首府。脏气各有俞，而诸俞亦有首府也。又喉为重楼之府。足少阴之脉循喉咙，挟舌本，肾气由此输入重楼之府矣。'
                },
                '手厥阴心包络经': {
                    '天池': '天，指人之上半身。池，水之停聚处。天池，大海名，山名，星名。此为乳房储积乳汁之象。',
                    '天泉': '天，指人之上半身。泉，水泉。天泉，星名；又古地名。指经气自上而下，如泉水之来自天上也。',
                    '曲泽': '曲，弯曲。泽，沼泽，又宫名。指穴在肘部浅凹之处也，可与尺泽互参。',
                    '郄门': '郄，孔穴的通称，又指郄穴。门，出入通达之处。为手厥阴经之郄穴，又如本经各穴之门户。可与阴郄互参。',
                    '间使': '间，间隙，孔窍。又相间即相伴之意。使，臣使，使役。穴在两筋之间，为臣使用命及君臣相间行事之处。心包为臣使之官。间使为心包五腧中之经穴，正臣使用命在前臂两筋间之间隙。',
                    '内关': '内，指胸膈之内及前臂之内侧。关，关格，关要。内关，病名。穴居前臂内侧之冲要，可以通胸膈关塞诸病也。与外关相对。居于太、少二阴之内，且为联络手厥阴与少阳关要之处也。',
                    '大陵': '大，高大。陵，丘陵。穴在掌后高骨形如丘陵之下方也。',
                    '劳宫': '劳，指劳苦，劳作。宫，王者之所居。能治妨碍手部劳作诸病，且穴在手掌中央为手部贵重之处。手司劳作，穴在掌心，因其所在与功用而得名。',
                    '中冲': '中，中指。冲，要冲。言穴居中指尖端冲要之地，可与少冲、关冲互参。'
                },
                '手少阳三焦经': {
                    '关冲': '关，通弯。冲，要冲。言穴居弯曲指端冲要之地也。手之第四指称无名指，不能单独伸直，故一名环指。与中冲、少冲其义相同。',
                    '液门': '液，指水液，腋部。门，出入通达之处。谓穴能主液所生病与腋部诸病也。三焦为决渎之官。此为手少阳经之荥穴，功能除烦热，存津液，通调水道，故为治疗液所生病之门户。少阳之脉循臑上肩。穴对臂臑病有效，而腋部病症亦与有关。',
                    '中渚': '中，指人身元气之根本，又指心神情志。渚，水中之小洲。言心神情志之气在此结集如洲渚也。既为元气之所聚，亦为治与情志有关的病症所当取。后世针灸歌赋均多“脊间心后针中渚”之说，而情志病正与心神有关也。',
                    '阳池': '阳，指手背及手少阳。池，水之停聚处。为手少阳脉气所过之原穴，犹如水之停积于池也。',
                    '外关': '外，指前臂外侧。关，关隘，关要。指穴居前臂外侧之要冲，又与内关相对，为手少阳厥阴互相联络关要之处。',
                    '支沟': '支，支持；又同肢，指上肢。沟，狭长之低洼处。穴在上肢尺桡两骨间之沟中，又须支臂取之。支肘屈臂，手掌向内，则尺桡两骨之沟自见，穴在沟端，故名。',
                    '会宗': '会，聚会，会合。宗，宗主，宗派。指穴为前臂各派阳脉会合之宗主。穴位斜出本经之外，联系三阳，绾罗诸脉，会宗之名其义可通。',
                    '三阳络': '三阳，指手太阳、阳明、少阳三经。络，联络，维系。与手三阳经皆有联系之意。穴位依傍会宗，在阳明、太阳之间，故一名大交脉，与三阴交可以互观。',
                    '四渎': '四，数名。渎，水之大川。四渎，星座名。古称江淮河济为四渎。指穴如四肢经气运行之川渎也。三焦乃决渎之官，为水道之所出，手足少阳上下同气，故上肢有四渎，下肢有中渎。',
                    '天井': '天，指上肢。井，深凹有水之处。天井，水名，星名，又地形名。言经气如井水之清净，而穴位亦有井之形象也。清阳实四肢、三焦主一身之阳，而上肢之经气亦如井水之清净也。手经各合穴只有此穴在肘关节之上际，边高中凹，有天井之象。',
                    '清冷渊': '清冷，清澈凉爽之意。渊，深水，深潭。清冷，又为水名。言穴能清热泻火，有如入清冷之深渊也。人之风骨清秀亦名清冷。',
                    '消泺': '消，消除，消渴。泺，水名。言穴用如清凉之水，能清热解渴也。阳热炽盛，取之消泺，则将如入清凉之水而消渴得以消除矣。与清冷渊可以互观。',
                    '臑会': '臑，肩下方之肌肉。会，聚会，会合。穴与臂臑及臑俞相近，又为手少阳、阳维交会之处。',
                    '肩髎': '肩部。髎，髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。泛指为肩部之凹陷处。',
                    '天髎': '天，指人体的上部。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴当肩背之间，以其位置较高而言。',
                    '天牖': '天，指人体的上部。牖，墙上通风采光的洞口。言穴能开通耳目壅塞之气，如人身上部之窗牖也，与天窗同义。',
                    '翳风': '翳，掩蔽。风，风邪。穴当衣领上缘，正为屏蔽风邪之处。',
                    '瘈脉': '瘛，瘛疭。脉，指筋脉及耳后的青脉。是治疗筋脉瘛疭的耳后青脉。穴在耳后青筋处，对小儿筋脉瘛疭病有显效，因其用而得名。',
                    '颅息': '颅，颅脑，头颅。息，安息，休息，又是塞满之意。谓穴能醒脑安神，治头目昏沉如塞诸病也。能治惊恐失神、惊痫瘛疭诸病，谓颅脑可以得而安息；而头目昏沉如塞者，亦可用以消除也。',
                    '角孙': '角，指头角，角星，又指东方阳春升发之气。孙，幼小、微弱之意。谓穴当头角未成之处，且有角星之象，又如春气在头、初生而未盛也。头骨外出者为角。足之三阳从头走足，角孙者少阳生发之气初生而未盛之象也。且与其能治筋脉抽搐、少阳风火上干诸病有关。',
                    '耳门': '耳，耳部。门，出入通达之处。穴居外耳道口，功能聪耳助听，有如声音入耳之门户。',
                    '和髎': '和，是声音调和之意；小笙也叫和，古之军门也叫和。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。指其能调治耳病增强听力，且穴居鬓角，有如军门之左右和也。穴与耳邻，可用以治耳病而助听，故名。',
                    '丝竹空': '丝竹，细小之竹。空，空窍，孔穴。谓眉形有如细小之竹叶，穴当眉梢之空隙中，故名。又“丝竹”为乐器之统称，与此有别。'
                },
                '足少阳胆经': {
                    '瞳子髎': '瞳子，指瞳孔。髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。穴近眼球，横直瞳孔，有明目之功，有如瞳子之孔窍也。',
                    '听会': '听，指听觉，听力。会，都会，聚会。穴在耳前，主治耳病，为耳部脉气之聚会，亦如管理听觉之都会处也。',
                    '上关': '上，下之对。关，机关，关节。穴在耳前下颌关节之颧弓之上方，与下关相对。',
                    '颔厌': '颔，腮颔。厌，是极与止的意思，又与餍通。指穴在颔部的边缘与咽食牵动所止之处。人在吞咽食物时，穴正当筋脉收引牵动所止之处，亦与颔厌之义有关。',
                    '悬颅': '悬，悬挂。颅，头颅。指其可治头目眩晕如悬诸病也。', '悬釐': '悬，悬挂。釐与氂通，是长毛与强屈之毛。象穴在强屈之鬓发长毛处。',
                    '曲鬓': '曲，弯曲。鬓，鬓角。指穴当 角之弯曲处。',
                    '率谷': '率，率领，表帅之意。谷，山洼无水之地，又肌肉之结合处即古之所谓“肉之大会”亦称为谷。全身以“谷”命名的各穴均在肢体，仅有率谷高居头上，有如诸谷穴之表帅。',
                    '天冲': '天，指头部。冲，冲要。天冲，星座名。借喻为高居头部冲要之地。', '浮白': '浮，浮游，漂浮，浮越。白，指金气，收敛之意。谓穴能收敛少阳浮越之神气也。',
                    '头窍阴': '头，相对于足而言。窍，孔窍。阴，指五脏之阴。以穴能治五脏阴窍之病也。对头部耳目口舌鼻诸窍之病，本穴均有调摄之功。',
                    '完骨': '完骨，古代解剖名。即今之颞骨乳突。穴当其处，骨穴同名。', '本神': '本，根本，本原。神，指心神及人身之阳气。意为穴处为人身元神之根本。',
                    '阳白': '阳，指阳光与头的阳部。白，白色，明白。谓穴能使病目见阳光而明白，及治肺风之眉上生白也。与四白穴上下相直，功用仿佛，可以互观。用治风寒外感、头痛泪出有效。阳白之名，亦可由此而来。',
                    '头临泣': '头，相对于足而言。临，是监督与治理之意。泪出不止为泣。为头部明目止泪之穴。能主目眩、目翳、目泪、目痛、反视诸病，因其功用而得名。',
                    '目窗': '目，眼目。窗，屋上通风采光的洞口。穴居眼之直上，有明目之功，有如通向眼目之窗户。',
                    '正营': '正，正当、正如之意。营，同荣，指春气。又东西为营。正营，为惊恐状。穴在头顶正中横线上，象少阳升发荣茂之气，功能安神定惊也。',
                    '承灵': '承，承受，奉承，承担。灵，神灵。脑为神灵之室，头顶骨古称天灵盖。穴在其下旁，乃承受脑神之处也。',
                    '脑空': '脑，颅脑。空，空虚，孔窍。指穴在后脑枕骨下方之空虚也。', '风池': '风，指气，又指风邪。池，水之停聚处。为风邪易于流连和为治风之所当取处。',
                    '肩井': '肩，项下的部位。井，深凹有水之处。穴在肩部正中凹陷如井之处，故名。', '渊腋': '渊，深水，深潭。腋，臂胁之间。指穴在腋下之隐伏深藏处，为腋部之渊薮。',
                    '辄筋': '辄，车之两。筋，筋肉。指穴在肋间状如两之筋肉处。',
                    '日月': '日月本为太阳与月亮。此指双目及胆之脏象而言。又，山名，旗名。象双目之光明及胆气之威仪也。双目为肝胆之所主，而胆募乃名日月也。',
                    '京门': '京，与丘同义，高大之土阜；又忧也。门，出入通达之处。穴位所在犹如胸廓大丘之门，可用以止恐定惊。',
                    '带脉': '带，指衣带，带下病。脉，经脉。带脉，脉名。穴当带脉之所过，与衣带所系之处，又可治带下病，故名。',
                    '五枢': '五为中数，指人身之中。枢，枢机，枢纽。穴位所在犹如人身中部之枢纽。', '维道': '维，维系。道，道路。意指穴处为维系与连接下肢之通道。',
                    '居髎': '居，是居住、占据与坐的意思。髎，指髋骨，髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。言穴居髋骨处，又为坐时之大空隙也。穴附于髋，言髋骨为穴位之所居据；且人在坐位时此处之空隙也更为明显。',
                    '环跳': '环，弯曲。跳，跃起，必须弯身环腿方可便于跳跃。指取穴时之体位及其能治环而难跳之腿病而言。环腿难伸，不能跳跃，为腿病的必然之象。此为治腿病之要穴。且在取此穴时必须侧卧、屈上腿、伸下腿，穴处即出现凹陷，也与环跳之象相符。',
                    '风市': '风，参诸风穴条。市，集市，货物集散之处。指穴处易为风邪所集聚，亦为驱散风邪之地也。此处为风邪所常入，亦为治风之常穴。',
                    '中渎': '中，指中间。渎，水之大川。指穴在股外侧足太阳、阳明两经之中，形如大川的大沟中。手足少阳上下同气，下肢之中渎与上肢之四渎也有互相应称之意。',
                    '膝阳关': '阳，指人体的外侧。关，机关，关节。言穴当膝关节外侧的关要之处。称“膝”者，是区别于腰阳关而言。',
                    '阳陵泉': '阳陵，指人体外侧局部之隆起处。泉，水从窟穴而出。穴在膝关节外侧隆起处腓骨小头之下方，与阴陵泉对应。',
                    '阳交': '阳，指阳经与阳气。交，指交会与交接。为诸阳脉之交会，又与少阳升发之气相应也。阳交为阳维之郄，又与足太阳、阳明相邻。《甲乙经》谓其“斜属三阳分肉间”，为四条阳经之依傍交会。',
                    '外丘': '外，指外侧，又为遗弃之意。丘，丘陵。以穴居本经阳交穴之外侧肌肉丰满如丘处而言。穴在本经直行路径之外、阳交的外方，如被遗弃，故名。',
                    '光明': '光，光照。明，明亮。光明、光亮明白与天气清净之意。穴用能使头脑清彻，目见光明也。故光明亦即指双目而言。功能调少阳之气，清利头目，对目病尤有效。故光明即指双目。双目为肝胆所主，而光明乃足少阳厥阴之络穴也。',
                    '阳辅': '阳，指小腿的外侧。辅，辅助，辅骨。言穴居小腿辅骨之前外方也。小腿骨古称辅骨，内侧称内辅，外侧称外辅。外辅骨又单指今之腓骨。穴在小腿外侧、腓骨前方，故名。',
                    '悬钟': '悬，悬挂，悬系；又钟锤与箍架均名悬。钟是乐器，又为钟铃。穴效如悬挂之钟，又当系带脚铃之处也。悬，通县，县者系也。钟锤名县，钟架亦名县。人老则耳不聪，目不明，故称“钟漏俱歇”。即耳不能听钟声，目不能视漏刻。足少阳之脉入耳中，出耳前，穴对耳鸣有显效。钟必有县和悬而能鸣，又象小腿如钟之悬系和多动少静也。亦与儿童悬挂脚铃之处相当，故名。',
                    '丘墟': '丘，丘陵。墟，同虚，丘墟；山下之基亦名虚。指穴在高大如丘外踝基底方之空软处。',
                    '足临泣': '临，是监督与治理之意。泪出不止为泣。为足部明目止泪之穴。与头临泣的功用有其相近之处，故上下同名。',
                    '地五会': '地，指地气，足部。五，同伍，指五趾与地面风寒暑湿相互为伍之诸气。会，聚会与会合。意为地气会于足，而五趾亦易为地之诸气所中也。',
                    '侠溪': '侠，通挟，通夹。溪，是山洼流水之沟；又筋膜之连接处，即古之所谓“肉之小会”。言穴在小四趾夹缝中也。',
                    '足窍阴': '窍，孔窍。阴，指五脏之阴。为足部对阴窍诸病有关之穴。本穴对咳、喉痹、舌强、口干、耳聋等病有效，与头窍阴的功用有其相近之处。足之窍阴与头之窍阴，更可上下相应矣。对前后阴之阴窍病，当也与有作用。'
                },
                '足厥阴肝经': {
                    '大敦': '大，丰富之意。敦，敦厚，土丘。指穴在形如丰厚的土丘处，能平土气之敦阜。', '行间': '行，行走。间，间隙，孔窍。人之步趋谓之行，穴当跖趾关节之间隙中。',
                    '太冲': '太，至也，极也，高大与尊贵之意。冲，冲要，又通沖，沖和与沖虚之意。太冲，脉名。地居冲要，脉气盛大，且有宁静聪明之象。象阴血之充盈盛大。象穴居足部之冲要。穴在足背，与冲阳紧邻。冲阳因太冲而得名，太冲亦较冲阳为尊贵。',
                    '中封': '中，指精神，指人身元气之根本，又指心神情志。封，指藏聚，是疆界与富有之意。意其为精神之藏聚，与情志活动有关。中封者乃肝经之气所聚之处，神与魂之封地也。',
                    '蠡沟': '蠡，瓢也，又贝壳名。沟，狭长之低洼处。谓穴在形如瓢缘处之沟中也。小腿后方肌肉丰满，其形如瓢，穴在其下际沟中，固形似而得名。',
                    '中都': '中，指精神，指人身元气之根本，又指心神情志，又指中间。都，都会，储积，又是池的意思，又为统帅之意。中都，古官府名，地名。意为穴当小腿之中，为肝经脉气之都会与统帅肝经脉气之郄穴。',
                    '膝关': '膝，膝部。关，机关，关节。泛指为膝部之机关。', '曲泉': '曲，弯曲。泉，水从窟穴而出。穴居膝关节屈曲之凹陷处，言经气深邃如泉也。',
                    '阴包': '阴，指足三阴经及下腹部。包，包罗，联系；又通胞。与足三阴经及下腹诸部俱有包罗联系之意。对前阴、下腹以及妇女胞官诸病，均有包罗在内的治疗作用。',
                    '足五里': '足，指下肢。五里，指五脏之里。意为此乃下肢与五脏在里诸病有关的孔穴。与手五里及手足三里互相应对。',
                    '阴廉': '阴，指前阴部。廉，以在胻骨外侧，故名为廉。穴当前阴部耻骨下方的边缘有棱处。',
                    '急脉': '急，指拘急，急促。脉，指筋脉，动脉。穴在腹股沟动脉搏动应手处，能舒前阴及下腹筋脉拘急诸病。',
                    '章门': '章，文采貌；山丘上平者亦曰章；又是障的意思。门，为守护与禁要之处。指季肋形如平顶之丘，穴在其下方，为章身之衣与屏障内脏的门户。',
                    '期门': '期，指期待，周期。门，出入通达之处。期门，汉代负责守卫的武官名。用以作为肝为将军之官的比譬，也指为气血运动周期的出入门户。经气的运行古说是三百六十五穴，至此已满一周矣。'
                },
                '督脉': {
                    '长强': '长，长大，旺盛。强，强壮，充实。喻经气与脊柱为人身强大的梁柱与肾气强健的象征。肾为作强之官，肾强则阳势壮。长强之名，也可与其能治遗精早泄及阳萎等症有关。',
                    '腰俞': '腰，指腰部；又同要。俞，见诸俞条。穴居腰部冲要之地，为腰部经气注输之处也。',
                    '腰阳关': '腰，指腰部；又同要。阳，指下焦之阳气。关，机关，关藏。穴当腰部之要冲，为下焦关藏元气之窟宅与腰部运动之机关。',
                    '命门': '命，指生命，重要之意。门，出入通达之处。指其为生气出入通达与维系生命之处。穴在两侧肾俞之中，以内外相应而得名。',
                    '悬枢': '悬，通旋，旋转，悬起。枢，枢纽，枢要。以穴当人身旋转枢要之处而得名。', '脊中': '脊，脊柱，指全部椎体。中，中间，中部。古人以脊柱为二十一节，此正当其中。',
                    '中枢': '中，中间，中部。枢，枢纽，枢要。指穴当脊椎中部枢要之处。',
                    '筋缩': '筋，筋脉。缩，挛缩。能治筋脉挛缩与筋脉驰缓诸病，为肝俞之辅助穴。肝主筋。筋缩两旁为肝俞。用治脊强、目上戴等筋脉抽搐诸病，自为其分内事，而对筋脉驰缓不收者，亦有缩筋之效也。',
                    '至阳': '至，是最与极的意思。阳，指心阳与背为阳。为阳气至盛与全身仰赖之处。穴当心后与背脊之中。',
                    '灵台': '灵，指神灵，心灵，性灵。台，高台与号令之处。灵台，台名，星名。此处指心。喻为心神居住与行使职能之处。',
                    '神道': '神，指心神及人身之阳气。道，指大道。意其为胸中之神气；又指道路。象其地位高显，如日如心也。神道者，胸中之神气乃日与心之义也。至谓其平齐心俞，下接灵台，为心神出入之道路，则其次焉。',
                    '身柱': '身，指全身。柱，梁柱。穴处为全身支柱之意。穴位上接巅顶，下通背腰，平齐两肩，居冲要之地，而又梁柱之用也。',
                    '陶道': '陶，陶丘，陶然。道，道路。指椎体依次高起状如陶丘，且有舒畅情志的陶然之用。椎体高出于肉，有“陶”之象，依次而下，即为陶之道路矣。',
                    '大椎': '大，巨大。椎，脊椎。第七颈椎为椎体中之最大者，穴在其下，故名。', '哑门': '哑，喑哑。门，意为要地。穴当治哑之处，亦为致哑之门。',
                    '风府': '风，指气，又指风邪。府，指府库。指其为风邪最易储积与治风所宜取之处。后脑与颈项最容易受风邪之侵犯，而其间之诸风穴（风府、风池、风门、翳风、秉风等）也为治疗风邪所必须。',
                    '脑户': '脑，颅脑。户，可以通过之处。督脉上行至风府，入属于脑，此处犹如入脑之门户。',
                    '强间': '强，强硬不和也。间，间隙，孔窍，又指中间。穴当顶骨与枕骨结合之中间，能治头痛项强诸病。', '后顶': '后，前之对。顶，头顶。即头顶最高处之稍后方。',
                    '百会': '百，百脉，百骸。会，朝会。居一身之最高，百脉百骸皆仰望朝会，如天之北辰北极也。', '前顶': '前，后之对。顶，头顶。即头顶最高处之稍前方。',
                    '囟会': '囟，囟门。会，聚会。指为经气在囟部聚会之处。额骨上方与顶骨连合处，古称为囟或囟门。',
                    '上星': '上，指头部。星，指精气。穴在前头部正中，正为阳精所聚之处。穴居头上，精英四照，故又名神堂、明堂。',
                    '神庭': '神，指脑之元神。庭，宫庭，庭堂。意为此乃脑神所居之高贵处也。',
                    '素髎': '素，白色与高洁之意。髎，髎，亦作窌，窟也，深空之貌，是邻近骨部的缝隙。指鼻尖地位尊贵，且在养生静坐时此处能出现白影之谓。穴居准头，地小而位高，有素王之义。',
                    '水沟': '水，指水液，涕水。沟，狭长之低洼处。穴在鼻柱下，人中沟中央，近鼻孔处，为鼻水所流注，且能治水病，故名。',
                    '兑端': '兑，同锐；又洞穴也，卦也。端，顶端。穴在上唇顶端，口腔这一大洞口之上方，故名。',
                    '龂交': '龂，亦作龈，齿根之肉。交，交合，交接。穴在齿龈与上唇内方之接合处，且为任督二脉之交会，故名。'
                },
                '任脉': {
                    '会阴': '会，聚会，会合。阴，指阴气，阴部，下部。穴当下腹最低处前后阴之间，为阴气之所聚会，又为任督冲三脉之会合，故名。',
                    '曲骨': '曲骨，古解剖名。穴在曲骨上缘，骨穴同名。耻骨上缘其形弯曲，故古称为曲骨或屈骨。穴正当曲骨上缘之中央，即名为曲骨，一名为屈骨。',
                    '中极': '中，指人身上下之中，根本与内部。极，指方位；又最也，与急通，也与其能治下腹内急不通诸病有关。言穴居人身之中，为元气之根本与最为重要之处，且能治内急不通诸病。',
                    '关元': '关，指关藏，关闭，机关。元，指元气。意为下焦元阴元阳关藏出入之所。',
                    '石门': '石，指坚硬与不能生长谷物之处。门，出入通达之处。石门，地名，山名。谓其能绝生育与可治腹部坚硬如石之病。此正为治疗石瘕之门户也。',
                    '气海': '气，指人身的元气与各种气病。海，是广大深远之意。穴处为人身生气之海，且能主一身之气疾。因此人身之生气是出于脐下，充塞周身。上下相应，气有泉源，自然川流不息矣。',
                    '阴交': '阴，指阴阳与阴经。交，指交会与交接。为人身上下之气交接之处，又为足少阴与任、冲三脉之交会。人身上下平脐分之，穴居脐下一寸，至此阴阳之气已相交接矣。足少阴与任冲之脉也在此互相交会。阴交可能是从“交阴”转变而来。',
                    '神阙': '神，指人之元神与脐神。阙，宫阙，门观；又同缺。意为元神出入之处与所居之宫阙。脐神亦指人身之元神。脐为腹之缺，故神阙有如元神出入之缺口。',
                    '水分': '水，指水液，水气。分，指分别，分利。功能分清浊，通水道，而主液所生病，故名。穴下为小肠之所处。清浊不分，溏泻泄利者，收效甚捷。',
                    '下脘': '下，相对于上、中而言。脘，胃也。穴当胃之下方也。',
                    '建里': '建，建立，建树，强健。又顺流而下亦谓之建。言其可以建立中焦之里气，水谷亦由此入腹里也。穴当水谷流入于胃里所由之处，而中焦之里气亦得以建立，脏腑因之而强健，有如建中汤矣。',
                    '中脘': '指穴当胃体的中部，相对于上脘及下脘而言。', '上脘': '指穴当胃体的上部。相对于下脘及中脘而言。',
                    '巨阙': '巨，巨大。阙，宫阙，门观；又同缺。巨阙，剑名。胸骨其形似剑，穴当其端；又为上腹之巨大凹陷处。',
                    '鸠尾': '指穴当形如鸠鸟尾部之处，且如鸠鸟之能治噎膈反胃也。胸骨柄如鸟头，体如鸟身，两侧肋骨如鸟翼。穴当胸骨剑突（蔽骨）形如鸟尾之处，内通胃脘，且因鸠能治噎取名鸠尾，象形而又志用。',
                    '中庭': '中，中间。庭，宫庭，庭堂。言穴居玉堂之下，胸腹之间，犹如堂中之庭也。天子布政之宫为明堂，明堂之中为中庭。',
                    '膻中': '膻，同袒。中，指胸中。膻中，心包络名。袒胸露乳，此处又正当其中。穴为心包之募，内外相应也。位于两乳之中，必须袒胸而取，此膻中之又一义也。',
                    '玉堂': '玉，金玉、贵重之意。堂，是高大明敞的居室。玉堂为宫殿之美称，又泛指富贵之家，借喻其地位之高贵。玉堂，汉代殿名。未央宫、建章宫内皆有玉堂。指宫殿之华丽。其上方为紫宫，下通中庭，乃宫殿中之庭堂也。',
                    '紫宫': '紫，尊贵的颜色。宫，王者之所居。紫宫，帝王的居室。指穴下为心君常居之处。与灵台前后相对，更见其地位之高贵。为心主之宫城。',
                    '华盖': '华，同花，华丽。盖，覆盖，伞盖。华盖，星名，又是帝王出入的宝伞。肺亦名华盖，象其覆于心上也。以形象和位置而得名',
                    '璇玑': '璇，同旋。玑，同机。璇玑，星名，又是古代观察天文的仪器。指其为旋转为枢机，象喉骨之转动。璇玑乃北斗星中天璇天机之合称，适当喉骨转动之下方也。',
                    '天突': '天，指天气及人身之上部。突，指灶突（即烟囱）。天气通于肺，穴处犹如肺气出入之灶突也。喉头既为清气所入，更为浊气之所出。天突之名至为允当。',
                    '廉泉': '廉，见上下廉条。泉，见各泉穴条。廉泉，水名。穴当喉结上缘有棱之处，有如吐液之泉源。为唾液所聚之处。',
                    '承浆': '承，承受，奉承，承担。浆，口中之浆水。指其可以承受口中之浆水而言。穴之内方常为唾液之所聚，故本穴又名天池、悬浆。'
                }
            }
            var stt = "\n" + jlm + "\n"
            var numm = 1
            for (var i in xw[jlm]) {
                var cc = xw[jlm][i]
                stt = stt + String(numm) + ". " + i + "：" + cc + "\n"
                numm += 1
            }
            document.getElementById("chuxingan1").innerText = stt;

        }
