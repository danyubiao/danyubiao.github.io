        function yearGz() {
            var time1 = new Date();
            var timestamp = time1.getTime()
            timestamp += dayytz * 24 * 60 * 60 * 1000
            var time = new Date(timestamp)
            var year = time.getFullYear();
            var ygz_id = (year - 4) % 60
            yeargz = ganzhi[ygz_id]
        }

        function moonGz() {
            // 获取节气月份干支
            var time1 = new Date();
            var timestamp = time1.getTime()
            timestamp += dayytz * 24 * 60 * 60 * 1000
            var time = new Date(timestamp)
            var newtimec = time.getTime();
            var year = time.getFullYear();
            if (newtimec >= jqsjc[String(year)]["立春"][0]) {
                yearnl = year
            }
            if (newtimec < jqsjc[String(year)]["立春"][0]) {
                yearnl = year - 1
            }
            dnjqsjc = jqsjc[String(yearnl)]
            for (var i in dnjqsjc) {
                if (newtimec <= dnjqsjc[i][1] && newtimec >= dnjqsjc[i][0]) {
                    dqjq = i;
                    jqsj = new Date(dnjqsjc[i][0]);
                    jqsj2 = new Date(dnjqsjc[i][1]);
                    moongz = yearmoongz[yeargz[0]][i];
                }
            }
        }

        function dayGz() {
            var gan = {
                "0": "己",
                "1": "庚",
                "2": "辛",
                "3": "壬",
                "4": "癸",
                "5": "甲",
                "6": "乙",
                "7": "丙",
                "8": "丁",
                "9": "戊",
            }
            var zhi = {
                "0": "巳", "1": "午", "2": "未", "3": "申", "4": "酉", "5": "戌", "6": "亥", "7": "子", "8": "丑", "9": "寅",
                "10": "卯", "11": "辰",
            }
            var time1 = new Date();
            var timestamp = time1.getTime()
            timestamp += dayytz * 24 * 60 * 60 * 1000
            var time = new Date(timestamp)
            var timestamp1 = Math.round(time.getTime() / 1000).toString();
            var day = (timestamp1 - 1652630400) / 60 / 60 / 24
            day = Math.floor(day)
            var dayg = ""
            var dayz = ""
            console.log(day)
            if (day >= 10) {
                dayg = day % 10
            } else if (day < 10) {
                dayg = day

            }
            if (day >= 12) {
                dayz = day % 12
            } else if (day < 12) {
                dayz = day
            }
            var dgz = gan[dayg] + zhi[dayz];
            daygz = dgz;
        }

            var mgz_id = (min + 59) % 60

        function NowTime() {

            //获取年月日
            var time1 = new Date();
            var timestamp = time1.getTime()
            timestamp += dayytz * 24 * 60 * 60 * 1000
            var time = new Date(timestamp)
            var year = time.getFullYear();
            var month = time.getMonth() + 1;
            var day = time.getDate();

            //获取时分秒
            var h = time.getHours();
            var m = time.getMinutes();
            var s = time.getSeconds();
            if (m == 0) {
                hour();
            }


            // 检查是否小于10
            h = check(h);
            // m=check(m);
            // s=check(s);

            // 给标签的html赋值
            tp = ((h * 60 * 60 + m * 60 + s) / 86400 * 100).toFixed(2)
            //'今天已经过去：' + tp + '%';
            var m1 = minGz(m);
            var s1 = secGz(s);
            document.getElementById('DataTime').innerHTML = tp + '%';
            document.getElementById('jindu').style.width = String(tp + '%');
            document.getElementById('DataTime2').innerHTML = year + "年" + month + "月" + day + "日  " + h + ":" + m + ":" + s;
            document.getElementById('DataTime3').innerHTML = yeargz + " " + moongz + " " + daygz + " " + hourgz + " " + m1 + " " + s1;
            document.getElementById('DataTime4').innerHTML = dqjq + "：" + String(jqsj.getFullYear()) + "年" + String(jqsj.getMonth() + 1) + "月" + String(jqsj.getDate()) + "日  " + String(jqsj.getHours()) + ":" + String(jqsj.getMinutes()) + ":" + String(jqsj.getSeconds()) + "---" + String(jqsj2.getFullYear()) + "年" + String(jqsj2.getMonth() + 1) + "月" + String(jqsj2.getDate()) + "日  " + String(jqsj2.getHours()) + ":" + String(jqsj2.getMinutes()) + ":" + String(jqsj2.getSeconds());
            // document.getElementById('DataTime4').innerHTML = String(new Date().getFullYear())+ "年" +String(new Date().getMonth()+1)+ "月" +String(new Date().getDate())+  "日  " +String(new Date().getHours())+ ":" +String(new Date().getMinutes())+ ":" +String(new Date().getSeconds());
        }

        //时间数字小于10，则在之前加个“0”补位。

            //三元运算
            var num;
            i < 10 ? num = "0" + i : num = i;
            return num;
        }
